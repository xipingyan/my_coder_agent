[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coder-agent"
version = "0.1.0"
description = "Local coding agent (OpenAI-compatible server, PySide6 GUI)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.5",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
coder-agent = "coder_agent.gui.app:main"
coder-agent-cli = "coder_agent.cli:main"
coder-agent-stress = "coder_agent.stress:main"

[tool.setuptools.packages.find]
include = ["coder_agent*"]

[tool.setuptools.package-data]
coder_agent = ["prompts/defaults/*.md", "defaults/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
