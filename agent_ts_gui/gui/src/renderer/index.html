<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Coder Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toolbar">
    <span id="root-label" class="root">(no project)</span>
    <span class="sep"></span>
    <label>Task type: <select id="task-combo"><option>(auto)</option></select></label>
    <label>Thinking effort: <select id="effort-combo">
      <option>default</option><option>none</option><option>low</option><option>medium</option><option>high</option>
    </select></label>
    <label title="Plan &amp; subtasks: split the goal into small subtasks, review the plan, confirm after every stage">
      Mode: <select id="mode-combo"><option>Single agent</option><option>Plan &amp; subtasks</option></select>
    </label>
    <span class="sep"></span>
    <button id="stop-btn" disabled>Stop</button>
    <button id="sp-btn" title="Show the system prompt that will be sent for the selected task type">System prompt</button>
    <button id="settings-btn">Settings</button>
  </div>

  <div id="body">
    <div id="left">
      <div id="left-tabs">
        <button class="tab active" data-tab="turns">Turns</button>
        <button class="tab" data-tab="sessions">Sessions</button>
      </div>
      <div id="tab-turns" class="tabpage">
        <ul id="turn-list" class="list"></ul>
      </div>
      <div id="tab-sessions" class="tabpage hidden">
        <button id="new-session-btn" class="wide">New session</button>
        <ul id="session-list" class="list"></ul>
      </div>
    </div>

    <div class="splitter" id="split-left" title="Drag to resize, double-click to reset"></div>

    <div id="mid">
      <div id="chat" class="log"></div>
      <div class="splitter h" id="split-input" title="Drag to resize, double-click to reset"></div>
      <div id="input-zone">
        <textarea id="input" placeholder="Describe the task...  (Ctrl+Enter to send)"></textarea>
        <div id="send-row">
          <span class="flex1"></span>
          <button id="attach-btn" title="Insert a file's content into the prompt">📎 File</button>
          <button id="resend-btn" title="Re-send the last prompt (rewinds to it first)">↻ Re-send</button>
          <button id="send-btn">Send (Ctrl+Enter)</button>
        </div>
      </div>
    </div>

    <div class="splitter" id="split-right" title="Drag to resize, double-click to reset"></div>

    <div id="right">
      <div id="right-tabs">
        <button class="tab active" data-tab="activity">Activity</button>
        <button class="tab" data-tab="plan">Plan</button>
        <button class="tab" data-tab="thinking">Thinking</button>
        <button class="tab" data-tab="commands">Commands</button>
        <button class="tab" data-tab="docs">Docs read</button>
      </div>
      <div id="tab-activity" class="tabpage log mono"></div>
      <div id="tab-plan" class="tabpage hidden"></div>
      <div id="tab-thinking" class="tabpage log hidden"></div>
      <div id="tab-commands" class="tabpage log mono hidden"></div>
      <div id="tab-docs" class="tabpage log mono hidden"></div>
    </div>
  </div>

  <div id="statusbar">
    <span id="state-label">Idle</span>
    <span id="llm-label"></span>
    <button id="server-ctx-btn" class="flat" title="Context length reported by the server. Click to refresh.">server cache: ?</button>
    <div id="ctx-bar"><div id="ctx-fill"></div><span id="ctx-text">context 0</span></div>
  </div>

  <div id="ctxmenu"></div>
  <div id="modal-backdrop"><div class="modal" id="modal"></div></div>

  <script src="app.js"></script>
</body>
</html>
