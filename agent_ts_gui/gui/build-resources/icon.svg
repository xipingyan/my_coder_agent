<?xml version="1.0" encoding="UTF-8"?>
<!-- Caicai (彩彩) coding agent icon: a minimalist robot head whose "mouth" is
     the coding symbol < >, wrapped in a rainbow "Caicai" glow on a dark
     velvety rounded square. All shapes are paths/arcs (no fonts) so the
     render is identical everywhere. Legible at 16px: head + two eyes + <>. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- dark velvety background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242428"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <!-- rainbow "Caicai" spectrum -->
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.25" stop-color="#ffb84d"/>
      <stop offset="0.5" stop-color="#5dff7f"/>
      <stop offset="0.75" stop-color="#4dc9ff"/>
      <stop offset="1" stop-color="#c84dff"/>
    </linearGradient>
    <!-- soft multi-color glow behind the head -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.35" stop-color="#c84dff" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#4dc9ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4dc9ff" stop-opacity="0"/>
    </radialGradient>
    <!-- glass highlight on the head -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded square background with a faint rainbow border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="none"
        stroke="url(#rainbow)" stroke-opacity="0.45" stroke-width="4"/>

  <!-- colorful glow core behind the agent -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- data particles fanning out -->
  <g>
    <circle cx="122" cy="128" r="9" fill="#ff4d6d" opacity="0.85"/>
    <circle cx="158" cy="96" r="5" fill="#ffb84d" opacity="0.8"/>
    <circle cx="384" cy="108" r="7" fill="#4dc9ff" opacity="0.85"/>
    <circle cx="420" cy="150" r="4" fill="#c84dff" opacity="0.8"/>
    <circle cx="112" cy="392" r="6" fill="#5dff7f" opacity="0.8"/>
    <circle cx="400" cy="404" r="8" fill="#ffb84d" opacity="0.8"/>
    <circle cx="432" cy="364" r="4" fill="#ff4d6d" opacity="0.7"/>
  </g>

  <!-- agent: minimalist robot head, rainbow glass shell -->
  <path d="M 186 140 H 326 A 100 100 0 0 1 426 240 V 352 A 100 100 0 0 1 326 452 H 186 A 100 100 0 0 1 86 352 V 240 A 100 100 0 0 1 186 140 Z"
        fill="url(#rainbow)" fill-opacity="0.14"
        stroke="url(#rainbow)" stroke-width="22"/>
  <!-- glass highlight on the upper half of the head -->
  <path d="M 186 140 H 326 A 100 100 0 0 1 426 240 V 352 A 100 100 0 0 1 326 452 H 186 A 100 100 0 0 1 86 352 V 240 A 100 100 0 0 1 186 140 Z"
        fill="url(#glass)"/>

  <!-- bright focused eyes -->
  <circle cx="196" cy="238" r="26" fill="#ffffff"/>
  <circle cx="316" cy="238" r="26" fill="#ffffff"/>
  <circle cx="196" cy="238" r="10" fill="#4dc9ff"/>
  <circle cx="316" cy="238" r="10" fill="#c84dff"/>

  <!-- mouth: the coding symbol < > -->
  <g fill="none" stroke="url(#rainbow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 196 322 L 236 352 L 196 382"/>
    <path d="M 316 322 L 276 352 L 316 382"/>
  </g>
</svg>
