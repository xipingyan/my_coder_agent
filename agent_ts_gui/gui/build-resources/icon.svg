<?xml version="1.0" encoding="UTF-8"?>
<!-- Coder Agent app icon: two "C" glyphs (CC) on a dark rounded square.
     Colors match the app themes: bg #1e1e1e (dark theme), accent #4a90d9.
     The C shapes are arcs (no font dependency) so rendering is identical everywhere.
     Each C: circle radius 92, gap of 80 degrees open to the right. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2d"/>
      <stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="cc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb3e8"/>
      <stop offset="0.55" stop-color="#4a90d9"/>
      <stop offset="1" stop-color="#2f6fb5"/>
    </linearGradient>
  </defs>
  <!-- rounded square background with a faint accent border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="none"
        stroke="#4a90d9" stroke-opacity="0.35" stroke-width="4"/>
  <!-- two C glyphs: thick arcs open to the right -->
  <g fill="none" stroke="url(#cc)" stroke-linecap="round">
    <path d="M 211.3 204.6 A 80 80 0 1 0 211.3 307.4" stroke-width="48"/>
    <path d="M 423.3 204.6 A 80 80 0 1 0 423.3 307.4" stroke-width="48"/>
  </g>
</svg>
